# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    tags:
      - '*'
    branches:
      - feat/create_dbt_doc

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
env:
  DBT_PROFILES_DIR: ../transformation/dbt_transformation
  DBT_TARGET: dev
  DBT_REDSHIFT_DATABASE: ${{secrets.DBT_REDSHIFT_DATABASE}}
  DBT_REDSHIFT_PWD: ${{secrets.DBT_REDSHIFT_PWD}}
  DBT_REDSHIFT_HOST: ${{secrets.DBT_REDSHIFT_HOST}}
  DBT_REDSHIFT_USER: ${{secrets.DBT_REDSHIFT_USER}}
  
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: 'g-lorena.github.io' #${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Pages
        uses: actions/configure-pages@v2
      - uses: actions/setup-python@v1
        with:
         python-version: "3.10.x"

      - name: Install dependencies
        run: |
         pip install install -r requirements.txt
         
      - name: Create dbt documentation
        run: |
          dbt deps
          dbt docs generate

      - name: Archive code coverage results
        uses: actions/upload-artifact@v3
        with:
          name: export_doc_generated
          path: target
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          # Upload entire repository
          path: target
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1