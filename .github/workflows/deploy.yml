name: Deploy to AWS ECR and EC2

on:
  push:
    branches:
      - feat/*  # Change this if needed
permissions:
      id-token: write # This is required for aws oidc connection
      contents: read # This is required for actions/checkout
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Git checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-TERRAFORM
          audience: sts.amazonaws.com

      #- name: Set up AWS credentials
      #  uses: aws-actions/configure-aws-credentials@v2
      #  with:
      #    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #    aws-region: eu-west-3  # Change this to your AWS region

      - name: Log in to Amazon ECR
        run: |
          make login-ecr

      - name: Build and push Docker image
        run: |
          make build-docker-image
          make push-docker-image
      
      - name: Deploy DAGs to EC2 via SSM
        uses: aws-actions/aws-ssm-remote@v1
        with:
          instance-ids: ${{ secrets.EC2_INSTANCE_ID }}  # ID of the target EC2 instance
          commands: |
            mkdir -p /home/${{ secrets.EC2_USER }}/airflow/dags
            cp -r airflow-dags/* /home/${{ secrets.EC2_USER }}/airflow/dags
          working-directory: .  # Use the root of the repositor
